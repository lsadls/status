# status — configuration
#
# Everything here is optional. Leave a key out (or write `key =`) and the
# documented default applies; a value that makes no sense prints a warning on
# stderr and is replaced by the default, so a typo never stops the line.
#
# This file belongs at ~/.config/status.ini (or $XDG_CONFIG_HOME/status.ini).
# Another path can be named with `--config <PATH>` or `$STATUS_CONFIG`.
#
# Switches take yes/no (also on/off, true/false, 1/0). A metric switched off is
# not read at all — the file behind it is never opened — and its field vanishes
# from the line instead of showing 0.
#
# Want a shorter line? These three keys remove the most:
#   [cpu]  mhz = no
#   [net]  show = no
#   [disk_io] show = no


# ── CPU: usage, frequency, temperature ────────────────────────────────
# Usage is always shown; the other two are the switches.
[cpu]
# Show the temperature. Off by default, because not every machine has a
# sensor; this file turns it on for the sample line in the docs.
temp = yes
# Thermal zone directory, or the `temp` file itself, e.g.
#   /sys/class/thermal/thermal_zone0
# Empty = auto-detect, preferring a package/core sensor
# (x86_pkg_temp, coretemp, k10temp, acpitz, ...).
# Ignored when temp = no: nothing is probed.
zone =
# Show the clock speed in MHz. With no, the `cpu MHz` field is never read.
mhz = yes
# Count usage per core instead of across the whole machine.
#   no  -> 0..100%, the figure `top` shows on its %Cpu(s) line
#   yes -> 0..(cores*100)%, e.g. 1600% on 16 cores, as `htop`/`top -H` do
# The core count is only read when this is yes.
per_core = no


# ── Memory ────────────────────────────────────────────────────────────
[mem]
# Which number to show: used | available | total
# `used` is total minus available, the same figure `free` reports.
figure = used
# Scale: 0 = KiB, 1 = MiB, 2 = GiB. MiB by default, like `free -m`.
unit = 1
# Printed after the number. Written out here so the line reads `8078MiB`;
# delete the line or leave it empty to print the bare number (`8078`).
suffix = MiB


# ── Battery ───────────────────────────────────────────────────────────
[bat]
# Show the battery. Default no: desktops do not have one.
show = yes
# Battery directory, e.g. /sys/class/power_supply/BAT0. Empty = auto-detect.
path =


# ── Network ───────────────────────────────────────────────────────────
[net]
# Show throughput. With no, no interface is looked up or read.
show = yes
# Interface name, e.g. enp2s0. Empty = auto-detect one that is up,
# falling back to lo when nothing else is available.
interface =
# Rates are per second and in KiB by default: 0 = KiB/s, 1 = MiB/s, 2 = GiB/s
unit = 0
# Printed after the number. A suffix that already ends in `/s` is used as is.
# Leave it empty to print bare numbers (`275↓ 0↑`).
suffix = K/s
# Step the unit up as the number grows: yes turns 2048K/s into 2M/s.
# Default no, so the number stays in the unit you asked for.
auto = no


# ── Disk: the device, its filesystem, and its throughput ──────────────
[disk]
# Whole block device as listed in /proc/diskstats (`lsblk -dn -o NAME`).
# Use the base device, not a partition: nvme0n1, not nvme0n1p1.
# Empty = pick the first physical disk found.
device =
# Mountpoint whose filesystem size is reported.
mount = /
# Which figure to show: available | used | total
# `available` is what a normal user can still write (f_bavail).
figure = available


# Capacity format, e.g. 127.4GiB. People quote disks in GB, so this is GiB
# with one decimal by default. `unit` and `suffix` mean the same as in [mem].
# There is no `auto` here on purpose: a filesystem does not change size from
# one line to the next, and a unit that switches back and forth is unreadable.
[disk_size]
unit = 2
# `auto` is not accepted here: a filesystem does not change size between lines.
suffix = GiB


# Throughput format, e.g. 76K/s↑ 0K/s↓. Left of the arrow is written, right is
# read. Defaults to KiB/s: disk activity is usually a few hundred KB/s, and a
# number in MB/s would just be 0.
[disk_io]
# Show throughput. With no, /proc/diskstats is never read; the capacity
# figure above is unaffected.
show = yes
unit = 0
# Same as [net] suffix: `K/s` here, empty for bare numbers.
suffix = K/s
# Same meaning as [net] auto.
auto = no


# ── Field labels ──────────────────────────────────────────────────────
# Text printed in front of each field, so a number says what it measures.
# Write a key empty to drop that label; leave the whole section out and the
# defaults below apply.
[prefix]
cpu = cpu:
mem = mem:
bat = bat:
net = net:
# Capacity and throughput are separate fields, so they get separate labels.
disk_size = disk:
disk_io = io:
date = date:


# ── Clock ─────────────────────────────────────────────────────────────
[date]
# strftime pattern. A pattern the formatter cannot render (e.g. %Q, or a
# trailing %) falls back to the default with a warning.
# Write a literal percent as %%.
fmt = %m-%d %a %H:%M:%S
